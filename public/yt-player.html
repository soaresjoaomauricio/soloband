<!doctype html>
<!-- Player do YouTube do Estúdio pra "separar ao vivo" (S15). Roda num <webview> dentro da tela do SoloBand:
     assim o som dele é capturado (e mutado) sozinho. A tela controla e lê o player por executeJavaScript. -->
<meta charset="utf-8" />
<title>Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { width: 100%; height: 100%; }
</style>
<div id="p"></div>
<script>
  const id = new URLSearchParams(location.search).get('v');
  // [estado, tempo, duração, velocidade]; -2 = ainda carregando.
  window.ytInfo = () => (window.yt?.getPlayerState ? [yt.getPlayerState(), yt.getCurrentTime(), yt.getDuration(), yt.getPlaybackRate()] : [-2, 0, 0, 1]);
  window.onYouTubeIframeAPIReady = () => {
    window.yt = new YT.Player('p', {
      videoId: id,
      width: '100%',
      height: '100%',
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin },
      events: { onReady: () => (window.ytReady = true), onError: (e) => (window.ytError = e.data) },
    });
  };
</script>
<script src="https://www.youtube.com/iframe_api"></script>
